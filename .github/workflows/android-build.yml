name: Android Release Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build & sign release (APK + AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform & build-tools 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create local.properties
        # The API token is OPTIONAL. If the secret is not set we write the
        # placeholder so the build still succeeds and the app uses demo data.
        # The real token is never printed to the logs.
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ -n "${FOOTBALL_DATA_API_TOKEN}" ]; then
            echo "FOOTBALL_DATA_API_TOKEN=${FOOTBALL_DATA_API_TOKEN}" >> local.properties
          else
            echo "FOOTBALL_DATA_API_TOKEN=your_api_token_here" >> local.properties
          fi
          echo "FOOTBALL_API_BASE_URL=https://api.football-data.org/v4" >> local.properties
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}

      - name: Decode release keystore
        # Requires GitHub Secrets:
        #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
        #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is not set."
            echo "Add the four signing secrets described in the README before releasing."
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${GITHUB_WORKSPACE}/release-keystore.p12"
          echo "Keystore decoded."
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/release-keystore.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build signed release AAB
        run: gradle :app:bundleRelease --no-daemon --stacktrace
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/release-keystore.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify APK signature (fail on debug certificate)
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools/35.0.0" -name apksigner | head -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found"; exit 1
          fi
          echo "Using $APKSIGNER"
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "ERROR: release artifact is signed with a DEBUG certificate. Failing build."
            exit 1
          fi
          echo "Release APK signature verified (not a debug certificate)."

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: cornerkick-planner-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload release AAB (Play upload target)
        uses: actions/upload-artifact@v4
        with:
          name: cornerkick-planner-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
